# POGO NatGrad Test Configuration
# 테스트용: halfcheetah-medium-expert, 시드 1개

# =============================================================================
# 공통 설정
# =============================================================================
common:
  # 기본 실험 설정 (빠른 테스트용)
  max_timesteps: 10000
  eval_freq: 5000
  eval_episodes: 10
  final_eval_runs: 5
  final_eval_episodes: 10
  
  # NatGrad 관련 설정
  use_natgrad: true
  natgrad_lr: 3e-4
  natgrad_momentum: 0.9
  
  # 로깅 및 저장
  save_model: true
  normalize: true
  wandb: false
  
  # Two-step 설정
  split_ratio: 0.5
  
  # 시드 설정 (테스트용)
  seeds: [0]

# =============================================================================
# 환경별 설정
# =============================================================================
environments:
  halfcheetah:
    medium-expert:
      w2_weight: 0.5
      entropy_weight: 1e-5
      learning_rate: 3e-4
      description: "HalfCheetah medium-expert dataset (TEST)"

