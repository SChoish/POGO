# POGO 실험 설정 파일
# 원스텝에서 w2_weight 튜닝을 위한 설정

common:
  max_timesteps: 1000000
  eval_freq: 10000
  seeds: [0, 1, 2, 3, 4]
  split_ratio: 0.5

environments:
  hopper:
    medium:
      w2_weight: 0.2
      learning_rate: 3e-4
